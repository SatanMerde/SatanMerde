<svg xmlns="http://www.w3.org/2000/svg" width="300" height="195" viewBox="0 0 300 195" fill="none" role="img">
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #00D2FF; }
    .lang-name { font: 600 13px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #ffffff; }
    .lang-percent { font: 400 13px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #9e9e9e; text-anchor: end; }
  </style>
  <rect data-testid="card-bg" x="0.5" y="0.5" rx="8" height="99%" width="299" fill="#0d1117" stroke="#30363d" stroke-opacity="0.6"/>
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Top Languages</text>
  </g>
  <g transform="translate(25, 52)">
    <mask id="bar-mask">
      <rect x="0" y="0" width="250" height="8" rx="4" fill="white"/>
    </mask>
    <g mask="url(#bar-mask)">
      <rect x="0" y="0" width="78.5" height="8" fill="#A97BFF" rx="2"/><rect x="78.5" y="0" width="67.7" height="8" fill="#f34b7d" rx="2"/><rect x="146.2" y="0" width="33.7" height="8" fill="#7355dd" rx="2"/><rect x="179.89999999999998" y="0" width="25.8" height="8" fill="#00B4AB" rx="2"/><rect x="205.7" y="0" width="13.3" height="8" fill="#555555" rx="2"/>
    </g>
  </g>
  <g transform="translate(25, 75)">
    
    <g transform="translate(0, 0)">
      <circle cx="5" cy="6" r="5" fill="#A97BFF"/>
      <text class="lang-name" x="18" y="10">Kotlin</text>
      <text class="lang-percent" x="140" y="10">31.4%</text>
    </g>
    <g transform="translate(0, 22)">
      <circle cx="5" cy="6" r="5" fill="#f34b7d"/>
      <text class="lang-name" x="18" y="10">C++</text>
      <text class="lang-percent" x="140" y="10">27.1%</text>
    </g>
    <g transform="translate(0, 44)">
      <circle cx="5" cy="6" r="5" fill="#7355dd"/>
      <text class="lang-name" x="18" y="10">C#</text>
      <text class="lang-percent" x="140" y="10">13.5%</text>
    </g>
    <g transform="translate(0, 66)">
      <circle cx="5" cy="6" r="5" fill="#00B4AB"/>
      <text class="lang-name" x="18" y="10">Dart</text>
      <text class="lang-percent" x="140" y="10">10.3%</text>
    </g>
    <g transform="translate(0, 88)">
      <circle cx="5" cy="6" r="5" fill="#555555"/>
      <text class="lang-name" x="18" y="10">C</text>
      <text class="lang-percent" x="140" y="10">5.3%</text>
    </g>
  </g>
</svg>