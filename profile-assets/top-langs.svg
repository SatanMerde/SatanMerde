    </g>
    <g transform="translate(0, 22)">
      <circle cx="5" cy="6" r="5" fill="#f34b7d"/>
      <text class="lang-name" x="18" y="10">C++</text>
      <text class="lang-percent" x="140" y="10">25.5%</text>
    </g>
    <g transform="translate(0, 44)">
      <circle cx="5" cy="6" r="5" fill="#7355dd"/>
      <text class="lang-name" x="18" y="10">C#</text>
      <text class="lang-percent" x="140" y="10">12.7%</text>
    </g>
    <g transform="translate(0, 66)">
      <circle cx="5" cy="6" r="5" fill="#00B4AB"/>
      <text class="lang-name" x="18" y="10">Dart</text>
      <text class="lang-percent" x="140" y="10">9.7%</text>
    </g>
    <g transform="translate(0, 88)">
      <circle cx="5" cy="6" r="5" fill="#555555"/>
      <text class="lang-name" x="18" y="10">C</text>
      <text class="lang-percent" x="140" y="10">5.0%</text>
    </g>
